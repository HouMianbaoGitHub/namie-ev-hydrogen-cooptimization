- id: ev_self_discharge
  name: EV 车辆停放时的电量损失率（车辆待机功耗，含电池自放电）
  value: 5.0e-4
  unit: 1/h
  sensitivity: {}
  source: "作者说明（2026-10-28）：该参数代表的是电动汽车整车的停放电量损失（vampire drain：车载电子、BMS、远程通信、温控等待机功耗），而不是电芯本身的自放电，所以高于电芯每月 1–3% 的典型值。原稿 PLEXOS Self Discharge Rate = 0.05 %/h。整车待机功耗的一手文献待补"
  report: "reports/新基准参数与实现审阅.md S10、§8；02_plan/D2_settings/04_ev.md M2"
  decided: "2026-10-19 作者：保留 0.05%/h 并在正文说明（vampire drain）；2026-10-28 作者确认理由：车辆待机功耗而非电芯自放电。04_ev.md M2 按电芯自放电判断'偏大'，不适用"
  status: confirmed
  verified: "2026-10-28 mapping/ev_map.yaml verdict=match"
  code_now: "每小时 0.05%，每天 1.19%，30 天 30.2%；按比例作用于电量"
  model_entry: "model.py L415 standing_loss=.0005（硬编码；L403 为分组分支，D2 不用）；n.snapshot_weightings.stores=1（L303，逐时）；build_fixed_profile.py L22、L69；进入：constraint: PyPSA Store 能量平衡 e_t = (1−0.0005)^1 · e_(t−1) + p_t（pypsa 1.2.4 define_store_constraints）；固定曲线递推"
  notes: "5.0e-4/h 相当于每天 1.19%（63 kWh 电池约 0.75 kWh/天、约 31 W 待机功率）。A 情景每车每年约 264 kWh，占行驶耗电 3.6%（商业）/6.4%（居民）。正文应写成车辆待机功耗并补文献（整车停放耗电的实测或厂商数据）。注意：按比例作用于电量，SoC 低时损失也小，所以 B/C 压低 SoC 可减少损失；若实际待机功耗与 SoC 无关，这一部分 A→B 价值（粗估 ≤ 0.2–0.3 十亿円）会偏高，可在正文说明。"

